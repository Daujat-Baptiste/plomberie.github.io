# ── Beja Nicolas — beja-chauffage-plomberie.fr ───────────────────────
# Copier dans /etc/nginx/sites-available/ puis lier dans sites-enabled/.
#
# Ce vhost ne sert le site QU'EN INTERNE (172.18.0.1:8080 / 127.0.0.1:8080).
# Le TLS, le domaine public et la redirection apex → www sont gérés par le
# reverse proxy Traefik partagé du VPS (voir /srv/traefik/dynamic/), qui
# route vers ce vhost en simple HTTP. Ce fichier ne doit donc ni écouter
# sur 80/443, ni gérer de certificat — Traefik s'en charge pour tous les
# sites hébergés sur ce VPS.
server {
    listen 172.18.0.1:8080;
    listen 127.0.0.1:8080;
    server_name beja-chauffage-plomberie.fr www.beja-chauffage-plomberie.fr;

    root /srv/apps/beja-chauffage-plomberie/app;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/beja-chauffage-plomberie_access.log;
    error_log  /var/log/nginx/beja-chauffage-plomberie_error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # URL propres : les anciennes adresses .html redirigent (301).
    # On teste $request_uri (URI d'origine) et non $uri : la directive index
    # réécrit en interne / vers /index.html sans changer $request_uri,
    # ce qui évite une boucle de redirection.
    # On construit l'URL en https://$host explicitement : ce vhost n'est
    # joint qu'en interne (http, port 8080) derrière Traefik qui termine le
    # TLS, donc $scheme/$server_port donneraient une Location publique en
    # http://...:8080 au lieu de https://.
    if ($request_uri ~ ^/index\.html(\?.*)?$) { return 301 https://$host/$1; }
    if ($request_uri ~ ^/(?!404\.html)([^/?]+)\.html(\?.*)?$) { return 301 https://$host/$1$2; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\.(git|claude|htaccess|gitignore) { return 404; }
    location ~ ^/(deploy/|CLAUDE\.md$) { return 404; }

    location ~* \.(woff2|jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    client_max_body_size 1m;

    # Pages sans extension (/realisations -> realisations.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
