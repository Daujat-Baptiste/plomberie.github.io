# ── Beja Nicolas — beja-chauffage-plomberie.fr ───────────────────────
# Copier dans /etc/nginx/sites-available/ puis lier dans sites-enabled/.
# Les certificats sont obtenus par deploy/setup-vps.sh (certbot, webroot).

# HTTP → HTTPS (les deux hôtes), sauf le challenge ACME
server {
    listen 80;
    listen [::]:80;
    server_name beja-chauffage-plomberie.fr www.beja-chauffage-plomberie.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beja-chauffage-plomberie.fr;
    }

    location / {
        return 301 https://www.beja-chauffage-plomberie.fr$request_uri;
    }
}

# HTTPS apex → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beja-chauffage-plomberie.fr;

    ssl_certificate     /etc/letsencrypt/live/beja-chauffage-plomberie.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beja-chauffage-plomberie.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.beja-chauffage-plomberie.fr$request_uri;
}

# Site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.beja-chauffage-plomberie.fr;

    root  /var/www/beja-chauffage-plomberie.fr;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/beja-chauffage-plomberie.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beja-chauffage-plomberie.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/beja-chauffage-plomberie.access.log;
    error_log  /var/log/nginx/beja-chauffage-plomberie.error.log;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript image/svg+xml
               application/manifest+json;

    # URL propres : les anciennes adresses .html redirigent (301).
    # On teste $request_uri (URI d'origine) et non $uri : la directive index
    # réécrit en interne / vers /index.html sans changer $request_uri,
    # ce qui évite une boucle de redirection.
    if ($request_uri ~ ^/index\.html(\?.*)?$) { return 301 /$1; }
    if ($request_uri ~ ^/(?!404\.html)([^/?]+)\.html(\?.*)?$) { return 301 /$1$2; }

    # Page 404 personnalisée
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Fichiers du dépôt à ne jamais servir
    location ~ /\.(git|claude|htaccess|gitignore) { return 404; }
    location ~ ^/(deploy/|CLAUDE\.md$) { return 404; }

    # Polices et images : un an, immuables
    location ~* \.(woff2|jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header ne s'hérite pas : on répète les en-têtes de sécurité
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # CSS / JS non versionnés : un jour
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # HTML, sitemap, robots, manifest : revalidation courte
    location ~* \.(html|xml|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Pages sans extension (/realisations -> realisations.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
